name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run tests
        run: node --test

      - name: Regenerate the site from resume.json
        run: node build.mjs

      - name: Fail if committed index.html is stale
        run: git diff --exit-code -- index.html
